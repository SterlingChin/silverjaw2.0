<script id="qbee-model">
'use strict';
const SAVE_KEY='qbee-save-v1';
const REVIVE_COST=20;
const SKINS=[
{id:'mint',name:'Original Q',cost:0,color:'#b7f39b',top:'#dcffb9',side:'#76ba75',detail:'The smile that started it all.'},
{id:'berry',name:'Berry Jelly',cost:10,color:'#ed9ac6',top:'#ffd0e7',side:'#b45f9e',detail:'A little wobblier. A lot pinker.'},
{id:'ice',name:'Ice Cube',cost:25,color:'#9ee3f8',top:'#d9faff',side:'#629ccd',detail:'Cool under falling pressure.'},
{id:'chef',name:'Chef Q',cost:40,color:'#ffe0aa',top:'#fff0cf',side:'#d1a369',detail:'Serving one perfect belly flop.'},
{id:'astro',name:'Astro Q',cost:60,color:'#d8dcf2',top:'#fffaff',side:'#8a8fae',detail:'One small splash for cube-kind.'},
{id:'bee',name:'Bumble Q',cost:80,color:'#f5d574',top:'#fff0aa',side:'#c1944c',detail:'The name was right there.'},
{id:'armor',name:'Iron Q',cost:100,color:'#df6e68',top:'#ffb091',side:'#a84859',detail:'Red armor. Gold visor. Big grin.'},
{id:'cosmic',name:'Cosmic Q',cost:200,color:'#bb9ce9',top:'#e4c9ff',side:'#7960b5',detail:'For the most dedicated dropper.'}
];
const LEVELS=[
{id:'space',name:'Orbital Outpost',theme:'SPACE',symbol:'✦',accent:'#7472b9',bg:'#191c38',wall:'#545984',edge:'#939aca',jello:'#9cebca',difficulty:'Easy',speed:135,count:8,gap:.46,description:'Float past satellite panels and laser gates. The jello is cleared for landing.'},
{id:'kitchen',name:'Kitchen Chaos',theme:'KITCHEN',symbol:'♨',accent:'#bf786c',bg:'#302129',wall:'#b27862',edge:'#e7b693',jello:'#ffaaa3',difficulty:'Easy',speed:145,count:9,gap:.44,description:'You are snack-sized. Slip through chopping boards and sizzling stove flames.'},
{id:'attic',name:'Attic Antics',theme:'ATTIC',symbol:'⌂',accent:'#9e7857',bg:'#282131',wall:'#886648',edge:'#c9a473',jello:'#dab0f2',difficulty:'Medium',speed:155,count:10,gap:.41,description:'A long-lost world of wooden beams, dusty trunks, and very narrow escapes.'},
{id:'garden',name:'Overgrown',theme:'GREENHOUSE',symbol:'❋',accent:'#5a987b',bg:'#172d2e',wall:'#548570',edge:'#a3d8a0',jello:'#bff18a',difficulty:'Medium',speed:160,count:11,gap:.40,description:'Drop through tangled garden trellises and shifting vine gates.'},
{id:'candy',name:'Sugar Rush',theme:'CANDY FACTORY',symbol:'✿',accent:'#b773b7',bg:'#30203b',wall:'#a36399',edge:'#ffc3df',jello:'#95e8ed',difficulty:'Hard',speed:175,count:12,gap:.38,description:'Candy walls, spinning sweet gates, and a bubblegum-colored landing.'},
{id:'volcano',name:'The Floor Is Jello',theme:'VOLCANO',symbol:'▲',accent:'#b75c4a',bg:'#30202b',wall:'#885a52',edge:'#f3a07e',jello:'#a4f7ca',difficulty:'Expert',speed:185,count:14,gap:.36,description:'Hot rock, laser walls, and flamethrowers. Keep your cool until the final splash.'}
];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const number=(v,fallback=0,max=1e7)=>Number.isFinite(v)&&v>=0?Math.min(Math.floor(v),max):fallback;
const freshSave=()=>({version:1,bank:0,owned:['mint'],skin:'mint',sound:false,modes:{story:{unlocked:0,records:{},last:0},free:{unlocked:LEVELS.length-1,records:{},last:0}},resume:null});
function normalizeSave(raw){
 const out=freshSave();if(!raw||raw.version!==1)return out;
 out.bank=number(raw.bank);out.owned=SKINS.filter(s=>s.cost===0||(Array.isArray(raw.owned)&&raw.owned.includes(s.id))).map(s=>s.id);
 out.skin=out.owned.includes(raw.skin)?raw.skin:'mint';out.sound=raw.sound===true;
 for(const mode of ['story','free']){const from=raw.modes?.[mode];if(!from)continue;out.modes[mode].unlocked=mode==='free'?LEVELS.length-1:number(from.unlocked,0,LEVELS.length-1);out.modes[mode].last=number(from.last,0,LEVELS.length-1);
 for(const l of LEVELS){const r=from.records?.[l.id];if(r)out.modes[mode].records[l.id]={wins:number(r.wins),best:number(r.best),pending:number(r.pending),collected:number(r.collected)};}}
 const r=raw.resume;if(r&&['story','free'].includes(r.mode)&&Number.isInteger(r.level)&&r.level>=0&&r.level<LEVELS.length&&(r.mode==='free'||r.level<=out.modes.story.unlocked))out.resume={mode:r.mode,level:r.level};
 return out;
}
class Progress {
 constructor(storage,onStorageError=()=>{}){this.storage=storage;this.onStorageError=onStorageError;this.save=freshSave();try{const raw=storage.getItem(SAVE_KEY);if(raw)this.save=normalizeSave(JSON.parse(raw));}catch(e){if(e instanceof SyntaxError){this.save=freshSave();}else this.onStorageError();}this.run=null;}
 persist(){try{this.storage.setItem(SAVE_KEY,JSON.stringify(this.save));}catch{this.onStorageError();}}
 record(mode,level){const key=LEVELS[level].id;return this.save.modes[mode].records[key]||=( {wins:0,best:0,pending:0,collected:0});}
 start(mode,level){if(!['story','free'].includes(mode)||!LEVELS[level]||(mode==='story'&&level>this.save.modes.story.unlocked))return false;const r=this.record(mode,level);r.pending++;this.run={mode,level,tries:r.pending,qoins:0,status:'falling'};this.save.modes[mode].last=level;this.save.resume={mode,level};this.persist();return true;}
 collect(){if(this.run?.status==='falling')this.run.qoins++;}
 die(){if(this.run?.status!=='falling')return false;this.run.qoins=0;this.run.status='dead';this.persist();return true;}
 revive(){if(this.run?.status!=='dead'||this.save.bank<REVIVE_COST)return false;this.save.bank-=REVIVE_COST;this.run.qoins=0;this.run.tries=++this.record(this.run.mode,this.run.level).pending;this.run.status='falling';this.persist();return true;}
 abandon(){if(this.run){this.run.qoins=0;this.run.status='left';}this.persist();}
 finish(){const r=this.run;if(r?.status!=='falling')return null;const bonus=Math.max(0,6-r.tries);const reward=r.qoins+bonus;this.save.bank+=reward;const record=this.record(r.mode,r.level);record.wins++;record.best=record.best?Math.min(record.best,r.tries):r.tries;record.pending=0;record.collected+=r.qoins;if(r.mode==='story')this.save.modes.story.unlocked=Math.max(this.save.modes.story.unlocked,Math.min(LEVELS.length-1,r.level+1));this.save.resume=null;r.status='won';this.persist();return{qoins:r.qoins,bonus,total:reward,tries:r.tries};}
 buy(id){const skin=SKINS.find(s=>s.id===id);if(!skin)return false;if(!this.save.owned.includes(id)){if(this.save.bank<skin.cost)return false;this.save.bank-=skin.cost;this.save.owned.push(id);}this.save.skin=id;this.persist();return true;}
 reset(){this.save=freshSave();this.run=null;this.persist();}
}
function expressionAt(time,reduced=false){
 if(reduced)return{eyes:1,yawn:0,grin:0,twitch:0};
 const blinkPhase=time%5.2,blink=blinkPhase>4.8&&blinkPhase<5.04?Math.sin((blinkPhase-4.8)/.24*Math.PI):0;
 const yawnPhase=time%23,yawn=yawnPhase>17&&yawnPhase<19.6?Math.sin((yawnPhase-17)/2.6*Math.PI):0;
 const grinPhase=time%13,grin=grinPhase>7&&grinPhase<8.6?Math.sin((grinPhase-7)/1.6*Math.PI):0;
 return{eyes:Math.max(.04,(1-blink)*(1-yawn*.58)),yawn,grin,twitch:Math.sin(time*1.7)*.012};
}
function makeCourse(level){const l=LEVELS[level],obstacles=[],qoins=[];const path=[[0,0],[-.34,.18],[.32,-.25],[-.25,-.32],[.33,.28],[0,-.34],[-.34,.32],[.30,0],[0,.30],[-.25,-.20],[.32,-.28],[0,.32],[-.3,.1],[.2,-.3]];
 for(let i=0;i<l.count;i++){const [x,y]=path[i];const type=i===0?'wall':(l.id==='kitchen'||l.id==='volcano')&&i%3===2?'flame':i%3===1?'laser':'wall';const z=420+i*320;obstacles.push({index:i,z,x,y,gap:l.gap,type,passed:false,broken:false});for(let c=0;c<3;c++)qoins.push({x,y,z:z+65+c*50,taken:false,missed:false});}
 return{obstacles,qoins,length:420+(l.count-1)*320+420};
}
function gateAt(obstacle,time,level){let x=obstacle.x,y=obstacle.y;if(obstacle.type==='laser'){x+=Math.sin(time*.8+obstacle.index)*.07;y+=Math.cos(time*.6+obstacle.index)*.05;}return{x,y,gap:obstacle.gap};}

}

function home(){if(fall&&progress.run?.status==='falling')progress.abandon();fall=null;particles=[];baseView('home');const resume=progress.save.resume;$('screen').innerHTML=`<section class="home"><div class="home-copy"><div class="eyebrow">Meet your new falling buddy</div><h1>Q<span>-</span>BEE</h1><div class="pronounce">/ KYOO-BEE / &nbsp; SMALL. SQUISHY. UNSTOPPABLE.</div><p class="lead">A little cube.<br>A <strong>long way down.</strong><br>Find the gap. Grab the gold. Stick the splash.</p><div class="actions"><button class="btn primary" id="story">Story Mode <span>↗</span></button><button class="btn" id="free">Free Play <span>↗</span></button><button class="btn" id="wardrobe">Change character ◇</button><button class="btn" id="levels">Choose level ▦</button></div>${resume?`<button class="link-button" id="resume">↳ Back to ${LEVELS[resume.level].name} · ${resume.mode==='story'?'Story':'Free Play'}</button>`:''}<div class="secondary-actions"><button class="link-button" id="how">How to play</button><button class="link-button" id="reset">Restart whole game</button></div></div><div class="hero-space" id="hero-space"><div class="hero-label">100% squish. 0% feet.<span>BUILT FOR THE FALL ↓</span></div></div></section>`;on('story',()=>levels('story'));on('free',()=>levels('free'));on('levels',()=>levels(chosenMode));on('wardrobe',wardrobe);on('how',howTo);on('reset',confirmReset);if(resume)on('resume',()=>levelBrief(resume.mode,resume.level,true));}

  ctx.strokeStyle='#efc19b44';ctx.lineWidth=s;for(let i=0;i<7;i++){ctx.beginPath();ctx.moveTo(p.x-r,p.y-r+i*r*.32);ctx.lineTo(p.x+r,p.y-r+i*r*.32);ctx.stroke();}

  ctx.strokeStyle='#563a2b88';ctx.lineWidth=1.4*s;for(let i=0;i<14;i++){ctx.beginPath();ctx.moveTo(p.x-r,p.y-r+i*r*.15);ctx.bezierCurveTo(p.x-r*.2,p.y-r+i*r*.15+r*.035,p.x+r*.3,p.y-r+i*r*.15-r*.025,p.x+r,p.y-r+i*r*.15);ctx.stroke();}
  for(const [x,y]of[[-.74,-.68],[.72,.67]]){const a=projection(x,y,d);roundRect(ctx,a.x-r*.2,a.y-r*.13,r*.4,r*.26,5*s,'#634d48','#bc9d78');roundRect(ctx,a.x-r*.025,a.y-r*.13,r*.05,r*.26,1,'#c6a166');}
 }else if(l.id==='garden'){
  ctx.strokeStyle='#284d41';ctx.lineWidth=4*s;for(let sign of [-1,1]){const x=p.x+sign*r*.78;ctx.beginPath();ctx.moveTo(x,p.y-r);ctx.bezierCurveTo(x+r*.18,p.y-r*.3,x-r*.20,p.y+r*.3,x,p.y+r);ctx.stroke();for(let i=0;i<7;i++){const y=p.y-r*.83+i*r*.28;ctx.save();ctx.translate(x,y);ctx.rotate(i%2?.6:-.6);ellipse(ctx,(i%2?1:-1)*r*.05,0,r*.11,r*.045,'#a1cd8699');ctx.restore();}}
 }else if(l.id==='candy'){
  ctx.strokeStyle='#ffd1de66';ctx.lineWidth=r*.11;for(let i=-4;i<12;i++){ctx.beginPath();ctx.moveTo(p.x-r+i*r*.3,p.y-r);ctx.lineTo(p.x-r+(i-6)*r*.3,p.y+r);ctx.stroke();}
  for(const [x,y]of[[-.72,.72],[.72,-.72]]){const a=projection(x,y,d);ellipse(ctx,a.x,a.y,r*.13,r*.13,'#ffe3f0');ellipse(ctx,a.x,a.y,r*.085,r*.085,'#dc82b7');ellipse(ctx,a.x,a.y,r*.04,r*.04,'#ffe3f0');}

  for(let i=0;i<12;i++){const x=-.95+(i%4)*.55,y=-.85+Math.floor(i/4)*.8,a=projection(x,y,d);polygon(ctx,[[a.x,a.y],[a.x+r*.18,a.y-r*.08],[a.x+r*.30,a.y+r*.12],[a.x+r*.2,a.y+r*.25],[a.x-r*.06,a.y+r*.16]],'#573f46','#da805766',s);}
  ctx.strokeStyle='#ffb26199';ctx.lineWidth=2*s;ctx.beginPath();ctx.moveTo(p.x-r*.9,p.y-r);ctx.lineTo(p.x-r*.7,p.y-r*.4);ctx.lineTo(p.x-r*.85,p.y);ctx.lineTo(p.x-r*.65,p.y+r);ctx.stroke();

}
function drawGate(o,l){const d=o.z-fall.depth;if(d< -70||d>2400)return;const g=gateAt(o,fall.time,fall.level),p=projection(0,0,d),s=p.scale,loX=g.x-g.gap,hiX=g.x+g.gap,loY=g.y-g.gap,hiY=g.y+g.gap;ctx.globalAlpha=clamp(1-d/3200,.1,1);
 if(o.broken){ctx.strokeStyle=l.edge+'66';ctx.lineWidth=2;ctx.setLineDash([3*s,10*s]);ctx.strokeRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2);ctx.setLineDash([]);ctx.globalAlpha=1;return;}
 const rects=[[-1,-1,loX+1,2],[hiX,-1,1-hiX,2],[loX,-1,hiX-loX,loY+1],[loX,hiY,hiX-loX,1-hiY]];
 for(const r of rects){rectWorld(...r,d+22,'#090d1c90');rectWorld(...r,d,l.wall,l.edge+'aa');}
 themeDetails(l,rects,d);
 const gap=projection(loX,loY,d),gapSize=(hiX-loX)*p.r;ctx.strokeStyle='#d9f890';ctx.lineWidth=2.4*s+1;ctx.shadowColor='#b9f898';ctx.shadowBlur=8*s;ctx.strokeRect(gap.x,gap.y,gapSize,gapSize);ctx.shadowBlur=0;
 if(o.type==='laser'||o.type==='flame'){const color=o.type==='laser'?'#ff88af':'#ffc975';ctx.strokeStyle=color;ctx.lineWidth=(o.type==='laser'?4:7)*s+1;ctx.shadowColor=color;ctx.shadowBlur=12*s;for(const y of [loY,hiY]){const a=projection(loX,y,d),b=projection(hiX,y,d);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}for(const x of [loX,hiX]){const a=projection(x,loY,d),b=projection(x,hiY,d);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}ctx.shadowBlur=0;
 if(o.type==='flame')for(let i=0;i<10;i++){const x=loX+i*(hiX-loX)/9,p0=projection(x,loY-.03,d);ellipse(ctx,p0.x,p0.y,3*s,(7+Math.sin(clock*10+i)*3)*s,'#ffb74d');}}
 else{ctx.strokeStyle=l.edge+'45';ctx.lineWidth=Math.max(1,s);for(let i=0;i<4;i++){const xx=-.88+i*.55;const p0=projection(xx,-.85,d);ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(p0.x,p0.y+p.r*.16);ctx.stroke();}for(const [x,y]of[[-.9,-.9],[.9,-.9],[-.9,.9],[.9,.9]]){const a=projection(x,y,d);ellipse(ctx,a.x,a.y,3*s,3*s,l.edge);}}
 if(d<400&&d>5){ctx.fillStyle='#f8f7ed';ctx.font=`bold ${Math.max(9,12*s)}px ui-monospace,monospace`;ctx.textAlign='center';ctx.fillText(o.type==='flame'?'HOT!':o.type==='laser'?'LASER':'GAP ↓',gap.x+gapSize/2,gap.y-12*s);}
 ctx.globalAlpha=1;}
function drawCoin(qoin){const d=qoin.z-fall.depth;if(qoin.taken||qoin.missed||d< -50||d>2100)return;const p=projection(qoin.x,qoin.y,d),r=9*p.scale;ctx.globalAlpha=clamp(1-d/2600,.15,1);ellipse(ctx,p.x,p.y,r*(.65+Math.abs(Math.cos(clock*3+qoin.z))*.35),r,'#ffdb83');ctx.strokeStyle='#a46f35';ctx.lineWidth=Math.max(1,1.7*p.scale);ctx.beginPath();ctx.ellipse(p.x,p.y,r*.6,r*.7,0,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;}
function drawJello(){const d=fall.course.length-fall.depth,p=projection(0,0,d),l=LEVELS[fall.level],s=p.r;roundRect(ctx,p.x-s,p.y-s,s*2,s*2,24*p.scale,l.jello+'b0',l.jello);for(let i=0;i<4;i++){ctx.strokeStyle=l.jello;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(p.x,p.y,s*(.25+i*.18),s*(.20+i*.15),0,0,Math.PI*2);ctx.stroke();}if(d<1000){ctx.fillStyle='#20434b';ctx.font=`900 ${Math.max(9,26*p.scale)}px Arial`;ctx.textAlign='center';ctx.fillText('JELLO ZONE',p.x,p.y+7*p.scale)}}
function burst(x,y,n,color){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*1.5,vy:(Math.random()-.5)*1.5,life:.6+Math.random(),color});}
function drawPlay(){const l=LEVELS[fall.level],a=arena();ctx.fillStyle=l.bg;ctx.fillRect(0,0,screenW,screenH);const grad=ctx.createRadialGradient(a.x,a.y,5,a.x,a.y,a.r*1.7);grad.addColorStop(0,'#080b1c');grad.addColorStop(1,l.bg);ctx.fillStyle=grad;ctx.fillRect(0,0,screenW,screenH);
 for(let i=0;i<12;i++){const d=i*240-(fall.depth%240),p=projection(0,0,d);ctx.strokeStyle=l.edge+Math.round(clamp(.28-d/12000,.06,.3)*255).toString(16).padStart(2,'0');ctx.lineWidth=1;ctx.strokeRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2);}
 for(const [x,y]of[[-1,-1],[1,-1],[-1,1],[1,1]]){const p=projection(x,y,-40);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(p.x,p.y);ctx.strokeStyle=l.edge+'40';ctx.stroke();}
 drawJello();const objects=[...fall.course.obstacles.map(o=>({z:o.z,obstacle:o})),...fall.course.qoins.map(c=>({z:c.z,qoin:c}))].sort((a,b)=>b.z-a.z);objects.forEach(v=>v.obstacle?drawGate(v.obstacle,l):drawCoin(v.qoin));
 const target=fall.course.obstacles.find(o=>!o.broken&&!o.passed&&o.z>=fall.depth);if(target&&target.z-fall.depth<330){const g=gateAt(target,fall.time,fall.level),p=projection(g.x,g.y,0);ctx.strokeStyle='#d9f89055';ctx.setLineDash([3,7]);ctx.beginPath();ctx.arc(p.x,p.y,Math.max(8,a.r*.07),0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);}
 const p=projection(fall.x,fall.y,0),size=Math.max(24,a.r*.19),skin=SKINS.find(s=>s.id===progress.save.skin);ellipse(ctx,p.x+10,p.y+23,size*.55,size*.3,'#080b2640');if(progress.run?.status!=='dead'){ctx.strokeStyle=skin.color+'35';ctx.lineWidth=size*.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p.x,p.y-size*.7);ctx.lineTo(p.x,p.y-size*1.5);ctx.stroke();drawCube(ctx,p.x,p.y,size,skin,inputVector().x*.1,clock);}else drawCube(ctx,p.x,p.y,size,skin,.3,clock);
 for(const part of particles){const pp=projection(part.x,part.y,0);ctx.globalAlpha=Math.min(1,part.life);roundRect(ctx,pp.x,pp.y,5,5,1,part.color);}ctx.globalAlpha=1;}
function drawHome(){ctx.fillStyle='#19192c';ctx.fillRect(0,0,screenW,screenH);const hero=$('hero-space'),rect=hero?.getBoundingClientRect();let x=screenW*.74,y=screenH*.48,r=Math.min(screenW*.14,160);if(rect){x=rect.left+rect.width*.5;y=rect.top+rect.height*.43;r=Math.min(rect.width*.32,rect.height*.36,170)}const grad=ctx.createRadialGradient(x,y,0,x,y,r*2.6);grad.addColorStop(0,'#73748c32');grad.addColorStop(1,'#19192c00');ctx.fillStyle=grad;ctx.fillRect(0,0,screenW,screenH);
 for(let i=0;i<60;i++){const sx=(i*173.31)%screenW,sy=(i*97.31)%screenH;ellipse(ctx,sx,sy,i%5===0?1.7:.8,i%5===0?1.7:.8,i%5===0?'#f4e7b848':'#ffffff18')}
 if(view!=='home')return;const bob=reducedMotion?0:Math.sin(clock*1.6)*10;ctx.save();ctx.translate(x,y);ctx.rotate(-.12);for(let i=0;i<3;i++){ctx.beginPath();ctx.ellipse(0,r*.65+i*r*.36,r*(1.18-i*.1),r*.30,0,0,Math.PI*2);ctx.strokeStyle=['#a8b49a35','#a8b49a20','#a8b49a10'][i];ctx.lineWidth=2;ctx.stroke();}ctx.restore();ellipse(ctx,x+r*.14,y+r*.68,r*.72,r*.16,'#07081340');drawCube(ctx,x-r*.13,y+bob,r*1.22,SKINS.find(s=>s.id===progress.save.skin),-.12+(reducedMotion?0:Math.sin(clock*.8)*.025),clock);
 for(let i=0;i<3;i++){const cx=x+Math.cos(i*2.3+clock*.08)*r*1.15,cy=y+Math.sin(i*2.3+clock*.08)*r;ctx.save();ctx.translate(cx,cy);ctx.rotate(i*.6);roundRect(ctx,-11,-11,22,22,7,['#ffc8ad','#aaa4e8','#d9f890'][i]);ctx.restore();}ctx.fillStyle='#d9f89080';ctx.font='20px monospace';ctx.fillText('+',x-r*1.3,y-r*.9);ctx.fillText('✧',x+r*1.13,y-r*.8);}
function frame(now){const dt=Math.min((now-lastTime)/1000||0,.033);lastTime=now;clock+=dt;if(view==='play'&&fall){if(!paused&&progress.run?.status==='falling'){const before=progress.run.qoins,result=fall.advance(dt,inputVector(),progress);if(progress.run.qoins>before)playTone(800+progress.run.qoins%4*100,.04);updateHud();if(progress.run.status==='dead')crash();else if(result)win(result);}for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);landing=Math.max(0,landing-dt);shake=Math.max(0,shake-dt);ctx.save();if(shake&&!reducedMotion)ctx.translate(Math.sin(clock*90)*shake*7,Math.cos(clock*70)*shake*5);drawPlay();ctx.restore();}else drawHome();requestAnimationFrame(frame);}
